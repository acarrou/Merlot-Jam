<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merlot Jam</title>
<meta name="theme-color" content="#2a0f1c">
<style>
  :root {
    --imgh: calc(100dvh - 190px);
    --bg: #2a0f1c;
    --ink: #f4e9dc;
    --muted: #c9a9a0;
    --gold: #c9a063;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    flex: none;
    text-align: center;
    padding: max(20px, env(safe-area-inset-top)) 16px 14px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 7vw, 2.8rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  header p {
    margin: 8px 0 0;
    color: var(--gold);
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    margin: 0 auto;
  }
  .slides {
    height: 100%;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slides:focus-visible { outline: none; }
  figure {
    flex: 0 0 100%;
    height: 100%;
    margin: 0;
    padding: 4px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    scroll-snap-stop: always;
  }
  figure img {
    display: block;
    max-width: 100%;
    max-height: var(--imgh);
    width: auto;
    height: auto;
    border-radius: 6px;
    background: #3a1727;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    -webkit-user-drag: none;
    user-select: none;
  }

  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    padding: 0 0 4px;
    border: 1px solid rgba(244, 233, 220, 0.55);
    border-radius: 50%;
    background: rgba(42, 15, 28, 0.62);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: var(--ink);
    font: inherit;
    font-size: 1.9rem;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .nav:active { background: rgba(42, 15, 28, 0.95); }
  .nav.prev { left: 6px; }
  .nav.next { right: 6px; }
  @media (min-width: 700px) {
    .stage { max-width: calc(var(--imgh) * 0.951 + 140px); }
    figure { padding: 4px 70px; }
    .nav.prev { left: 8px; }
    .nav.next { right: 8px; }
  }

  footer {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 16px max(18px, env(safe-area-inset-bottom));
  }
  .count {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.3em;
  }
  .dots { display: flex; gap: 2px; }
  .dots button {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .dots button::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.35;
    transition: opacity 0.2s, background 0.2s, transform 0.2s;
  }
  .dots button[aria-current="true"]::before {
    background: var(--gold);
    opacity: 1;
    transform: scale(1.3);
  }
  @media (prefers-reduced-motion: reduce) {
    .slides { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <header>
    <h1>Merlot Jam</h1>
    <p>From vine to jar</p>
  </header>

  <div class="stage">
    <div class="slides" id="slides" tabindex="0" aria-label="Photos, swipe to browse">
      <figure>
        <img src="images/01.jpg?v=3" width="1711" height="1800" alt="Embossed copper plaque reading Castlerock Vineyard, Napa County, California">
      </figure>
      <figure>
        <img src="images/02.jpg" width="1350" height="1800" alt="Two people picking Merlot grapes from the vines in autumn">
      </figure>
      <figure>
        <img src="images/03.jpg" width="1350" height="1800" alt="Washed grapes in a steel bowl and a colander">
      </figure>
      <figure>
        <img src="images/04.jpg" width="1350" height="1800" alt="Grapes being crushed in an orange enamel pot with a wooden masher">
      </figure>
      <figure>
        <img src="images/05.jpg" width="1350" height="1800" alt="Crushed grapes being strained through purple-stained cloth">
      </figure>
      <figure>
        <img src="images/06.jpg" width="1350" height="1800" alt="A woman stomping grapes in a giant cloth-lined bowl in front of a vineyard">
      </figure>
    </div>
    <button class="nav prev" id="prev" aria-label="Previous photo">&#8249;</button>
    <button class="nav next" id="next" aria-label="Next photo">&#8250;</button>
  </div>

  <footer>
    <div class="count" id="count" aria-live="polite">I / VI</div>
    <div class="dots" id="dots"></div>
  </footer>

<script>
  const slides = document.getElementById('slides');
  const figures = [...slides.children];
  const dots = document.getElementById('dots');
  const count = document.getElementById('count');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  const label = n => roman[n] || String(n + 1);
  let current = 0;

  const n = figures.length;
  const AUTO_MS = 4000;      // time each photo stays up
  const RESUME_MS = 8000;    // pause after someone touches it
  let timer;

  const go = i => {
    i = ((i % n) + n) % n;   // wrap around at both ends
    slides.scrollTo({ left: i * slides.clientWidth });
  };
  const schedule = ms => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!document.hidden) go(current + 1);
      schedule(AUTO_MS);
    }, ms);
  };
  const hold = () => schedule(RESUME_MS);

  figures.forEach((_, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Photo ' + (i + 1));
    b.addEventListener('click', () => { go(i); hold(); });
    dots.appendChild(b);
  });

  const update = () => {
    current = Math.round(slides.scrollLeft / slides.clientWidth);
    count.textContent = label(current) + ' / ' + label(figures.length - 1);
    [...dots.children].forEach((d, i) => d.setAttribute('aria-current', i === current));
  };

  slides.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', () => slides.scrollTo({ left: current * slides.clientWidth, behavior: 'instant' }));
  prev.addEventListener('click', () => { go(current - 1); hold(); });
  next.addEventListener('click', () => { go(current + 1); hold(); });
  ['touchstart', 'pointerdown', 'wheel'].forEach(t =>
    slides.addEventListener(t, hold, { passive: true }));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(current + 1); hold(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); hold(); }
  });
  update();
  schedule(AUTO_MS);
</script>
</body>
</html>
