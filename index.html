<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merlot Jam</title>
<meta name="theme-color" content="#2a0f1c">
<style>
  :root {
    --bg: #2a0f1c;
    --ink: #f4e9dc;
    --muted: #c9a9a0;
    --gold: #c9a063;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 72px 16px 40px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 11vw, 5rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  header p {
    margin: 18px 0 0;
    color: var(--gold);
    font-size: 0.85rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
    display: grid;
    gap: 56px;
  }
  figure { margin: 0; }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 6px;
    background: #3a1727;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  figcaption {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.3em;
  }
  footer {
    text-align: center;
    padding: 8px 16px 72px;
    color: var(--gold);
    font-size: 1.4rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Merlot Jam</h1>
    <p>From vine to jar</p>
  </header>

  <main>
    <figure>
      <img src="images/01.jpg" width="1350" height="1800" alt="Embossed copper plaque reading Castlerock Vineyard, Napa County, California">
      <figcaption>I</figcaption>
    </figure>
    <figure>
      <img src="images/02.jpg" width="1350" height="1800" loading="lazy" alt="Two people picking Merlot grapes from the vines in autumn">
      <figcaption>II</figcaption>
    </figure>
    <figure>
      <img src="images/03.jpg" width="1350" height="1800" loading="lazy" alt="Washed grapes in a steel bowl and a colander">
      <figcaption>III</figcaption>
    </figure>
    <figure>
      <img src="images/04.jpg" width="1350" height="1800" loading="lazy" alt="Grapes being crushed in an orange enamel pot with a wooden masher">
      <figcaption>IV</figcaption>
    </figure>
    <figure>
      <img src="images/05.jpg" width="1350" height="1800" loading="lazy" alt="Crushed grapes being strained through purple-stained cloth">
      <figcaption>V</figcaption>
    </figure>
    <figure>
      <img src="images/06.jpg" width="1350" height="1800" loading="lazy" alt="A woman stomping grapes in a giant cloth-lined bowl in front of a vineyard">
      <figcaption>VI</figcaption>
    </figure>
  </main>

  <footer>&#10022;</footer>
</body>
</html>
